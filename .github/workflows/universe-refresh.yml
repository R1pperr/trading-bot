name: Universe refresh

on:
  schedule:
    # Sundays at 06:17 UTC, before the new trading week. Off-the-hour, because
    # GitHub delays jobs scheduled at the top of the hour.
    - cron: "17 6 * * 0"
  workflow_dispatch:   # adds a "Run workflow" button so you can start it by hand

permissions:
  contents: write      # lets the job save universe/stocks.json and universe/crypto.json

concurrency:
  group: universe-refresh   # its own group, so the 15-minute bot runs can't cancel it
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Rebuild the lists (reads data only, places no orders)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python universe.py

      - name: Save the lists
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d universe ]; then git add universe; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update the stock and crypto universe"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "Could not save the lists after 5 tries."
          exit 1
