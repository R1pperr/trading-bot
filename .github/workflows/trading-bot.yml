name: Trading bot (paper)

on:
  schedule:
    # A backup, because GitHub's scheduler is unreliable: on 2 Nov 2026 it ran 2 of about 46
    # slots. The next-run job below keeps the 15-minute rhythm, and this restarts it if it stops.
    # Off-the-hour minutes, because GitHub delays jobs scheduled at the top of the hour.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:   # adds a "Run workflow" button so you can start it by hand
    inputs:
      telegram_test:
        description: "Also send one Telegram test message (places no order)"
        type: boolean
        default: false

permissions:
  contents: write      # lets the job save the trade log and dashboard data back into the repository

concurrency:
  group: trading-bot   # never run two copies at the same time
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main    # a run that waited in line must still start from the newest saved log

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Send a Telegram test message
        if: inputs.telegram_test
        continue-on-error: true   # a Telegram problem must never stop the bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notifier.py

      - name: Run the bot (paper account)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Save the trade log and dashboard data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f logs/trade_log.csv ]; then git add -f logs/trade_log.csv; fi
          if [ -d docs/data ]; then git add docs/data; fi
          if [ -d state ]; then git add state; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update trade log and dashboard data"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Could not save the trade log and dashboard data after 3 tries."
          exit 1

  next-run:
    # Each run starts the next one, so the bot doesn't depend on GitHub's scheduler. The pacemaker
    # environment (Settings, Environments) holds this job for 14 minutes without using a runner.
    # If a run fails the chain carries on. Cancelling a run stops it until the schedule restarts it.
    needs: run-bot
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pacemaker
    permissions:
      actions: write
    steps:
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run trading-bot.yml --repo "$GITHUB_REPOSITORY" --ref main; then exit 0; fi
            sleep 10
          done
          echo "Could not start the next run after 3 tries. The schedule will restart the chain."
          exit 1
