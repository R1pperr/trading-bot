name: Trading bot (paper)

on:
  schedule:
    # Every 15 minutes, every day, because crypto never closes. Stocks still trade only
    # while the market is open: the bot itself checks that.
    # Off-the-hour minutes, because GitHub delays jobs scheduled at the top of the hour.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:   # adds a "Run workflow" button so you can start it by hand
    inputs:
      telegram_test:
        description: "Also send one Telegram test message (places no order)"
        type: boolean
        default: false

permissions:
  contents: write      # lets the job save the trade log and dashboard data back into the repository

concurrency:
  group: trading-bot   # never run two copies at the same time
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main    # a run that waited in line must still start from the newest saved log

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Send a Telegram test message
        if: inputs.telegram_test
        continue-on-error: true   # a Telegram problem must never stop the bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notifier.py

      - name: Run the bot (paper account)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Save the trade log and dashboard data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f logs/trade_log.csv ]; then git add -f logs/trade_log.csv; fi
          if [ -d docs/data ]; then git add docs/data; fi
          if [ -d state ]; then git add state; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update trade log and dashboard data"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Could not save the trade log and dashboard data after 3 tries."
          exit 1
